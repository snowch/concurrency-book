[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One-line meanings of instructions: data, read as a table, kept on one line each.
"tools/mnemonics.py" = ["E501"]
# The same for the C constructs the kernels use beyond Kernighan and Ritchie.
"tools/cdict.py" = ["E501"]
# The page's scripts are JavaScript inside Python strings; their lines are the browser's business.
"scripts/build-site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
