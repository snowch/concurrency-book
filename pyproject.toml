[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The page's scripts are JavaScript inside Python strings; their lines are the browser's business.
"scripts/build-site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
