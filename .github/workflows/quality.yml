name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang 18, lld and clang-format, the compiler the fragments are pinned to
        # tools/lower.py refuses another major version: a different clang emits different
        # instructions, and the fragments would no longer be what their conditions line says.
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 clang-format-18

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: MyST (pinned) and Playwright
        run: |
          npm install -g "mystmd@$(node -p "require('./package.json').devDependencies.mystmd")"
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      - name: Everything, exactly as `make check` runs it
        env:
          CLANG: clang-18
          PATH: /usr/lib/llvm-18/bin:${{ env.PATH }}
        run: ./scripts/ci-check.sh
