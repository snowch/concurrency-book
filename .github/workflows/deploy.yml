name: Deploy the book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        # Pages must be switched on by hand, once, with GitHub Actions as the source: Settings,
        # Pages, "Build and deployment", Source. The workflow's token cannot create the site, and
        # a site set to "Deploy from a branch" refuses the deployment this workflow makes.
        uses: actions/configure-pages@v5

      - name: clang 18 and lld, the compiler the fragments are pinned to
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: MyST (pinned)
        run: npm install -g "mystmd@$(node -p "require('./package.json').devDependencies.mystmd")"

      # The fragments and traces are committed and checked by the Quality workflow. Every URL in
      # the site is relative, so no base path needs to be passed: the same build works at a
      # domain root and under /concurrency-book/.
      - name: Compile the kernels, parse the pages, render the site
        env:
          CLANG: clang-18
        run: |
          python3 tools/lower.py --wasm
          ./scripts/parse-book.sh
          python3 scripts/build-site.py --out _build/html
          python3 scripts/check-built-links.py _build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
